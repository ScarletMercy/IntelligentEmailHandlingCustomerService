[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-email"
version = "1.3.0"
description = "AI-driven QQ email auto customer support agent"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "韩飞摩" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Email",
]
dependencies = [
    "aioimaplib>=1.0",
    "aiosmtplib>=3.0",
    "beautifulsoup4>=4.12",
    "cryptography>=50.0.0",
    "httpx>=0.27",
    "openai>=2.0",
    "python-dotenv>=1.0.0",
    "qrcode>=8.2",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "ruff>=0.8",
    "mypy>=2.3.1",
    "types-qrcode>=8.2.0.20260518",
]

[tool.mypy]
# 目标下限 3.10（与 requires-python 一致）；只检查源码包，测试另行处理
python_version = "3.10"
files = ["ai_email"]
# 未注解函数也检查函数体（逐步补全注解期间不放过真实类型错误）
check_untyped_defs = true

# aioimaplib 无 py.typed/stub 包
[[tool.mypy.overrides]]
module = "aioimaplib"
ignore_missing_imports = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# E/F/W/I 基础规则之上：
#   B     bugbear：可变默认参数、循环变量绑定等真实 bug 模式
#   UP    pyupgrade：旧式 typing（Optional/Tuple）统一为 PEP 604/585
#   SIM   simplify：可简化的冗余分支/推导式
#   ASYNC flake8-async：异步项目最相关（async 上下文中的错误用法）
#   C4    comprehensions：推导式误用
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "C4"]

[tool.setuptools.packages.find]
include = ["ai_email*"]

[project.scripts]
ai-email = "ai_email:main"
